# Shared setup for master-packages jobs: secret presence checks, git-crypt
# unlock and a master-only build cache. The calling job installs the pinned
# Rust toolchain first. The native request-signing key is not written here:
# the build step materializes it for its one command
# (.github/scripts/with-native-signing-key.sh), so later dependency installs
# never see it. `.github/**` is git-crypt-exempt so GitHub can read this file.
# Never echo the secrets this action receives.
name: agx package setup
description: Unlock the checkout and prepare a shipped-build environment
inputs:
  gitcrypt-key:
    description: GITCRYPT_KEY_B64
    required: true
  native-key-hex:
    description: PROJECTAG_NATIVE_SIGNING_KEY_HEX (32 bytes, hex)
    required: true
  package-key:
    description: AGX_CI_PACKAGE_KEY (64 hex)
    required: true
  cache-key:
    description: Build cache name; jobs that build the same thing pass the same name
    required: true
  extra-workspaces:
    description: More rust-cache `workspace -> target` lines (one per line)
    required: false
    default: ""
  save-cache:
    description: Whether this job writes the cache (one job per cache name)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Require secrets
      shell: bash
      env:
        GITCRYPT_KEY_B64: ${{ inputs.gitcrypt-key }}
        NATIVE_KEY_HEX: ${{ inputs.native-key-hex }}
        AGX_CI_PACKAGE_KEY: ${{ inputs.package-key }}
      run: |
        missing=""
        [ -n "$GITCRYPT_KEY_B64" ] || missing="$missing GITCRYPT_KEY_B64"
        [ -n "$NATIVE_KEY_HEX" ] || missing="$missing PROJECTAG_NATIVE_SIGNING_KEY_HEX(cargo agx ci key upload-native)"
        [ -n "$AGX_CI_PACKAGE_KEY" ] || missing="$missing AGX_CI_PACKAGE_KEY(cargo agx ci key init)"
        if [ -n "$missing" ]; then
          echo "::error::missing repository secrets:$missing"
          exit 1
        fi
    - name: Install git-crypt
      shell: bash
      run: |
        set -euo pipefail
        if command -v git-crypt >/dev/null; then exit 0; fi
        if [ "$RUNNER_OS" = macOS ]; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install git-crypt
        else
          sudo apt-get update
          sudo apt-get install -y git-crypt
        fi
    - name: Unlock git-crypt
      shell: bash
      env:
        GITCRYPT_KEY_B64: ${{ inputs.gitcrypt-key }}
      run: bash .github/scripts/git-crypt-unlock.sh
    - uses: Swatinem/rust-cache@v2
      continue-on-error: true
      with:
        workspaces: |
          . -> target
          backend -> target
          tools/agx -> target
          mobile -> target
          ${{ inputs.extra-workspaces }}
        # The key is the cache name plus rust-cache's toolchain, environment
        # and lockfile hashes, not the job id: shards of one build, and a
        # keep-alive job, compute the same key.
        prefix-key: master-packages-v2
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true
        # Only master writes caches, and only the job chosen per cache name;
        # every other job restores. A key that already exists is not saved again.
        save-if: ${{ github.ref == 'refs/heads/master' && inputs.save-cache == 'true' }}
