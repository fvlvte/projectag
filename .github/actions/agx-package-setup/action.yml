# Shared setup for master-packages jobs: git-crypt unlock, the native
# request-signing key the shipped binaries embed and a master-only build
# cache. The calling job installs the pinned Rust toolchain first. `.github/**` is git-crypt-exempt so GitHub
# can read this file. Never echo the secrets this action receives.
name: agx package setup
description: Unlock the checkout and prepare a shipped-build environment
inputs:
  gitcrypt-key:
    description: GITCRYPT_KEY_B64
    required: true
  native-key-hex:
    description: PROJECTAG_NATIVE_SIGNING_KEY_HEX (32 bytes, hex)
    required: true
  package-key:
    description: AGX_CI_PACKAGE_KEY (64 hex)
    required: true
  cache-key:
    description: Build cache prefix
    required: true
runs:
  using: composite
  steps:
    - name: Require secrets
      shell: bash
      env:
        GITCRYPT_KEY_B64: ${{ inputs.gitcrypt-key }}
        NATIVE_KEY_HEX: ${{ inputs.native-key-hex }}
        AGX_CI_PACKAGE_KEY: ${{ inputs.package-key }}
      run: |
        missing=""
        [ -n "$GITCRYPT_KEY_B64" ] || missing="$missing GITCRYPT_KEY_B64"
        [ -n "$NATIVE_KEY_HEX" ] || missing="$missing PROJECTAG_NATIVE_SIGNING_KEY_HEX(cargo agx ci key upload-native)"
        [ -n "$AGX_CI_PACKAGE_KEY" ] || missing="$missing AGX_CI_PACKAGE_KEY(cargo agx ci key init)"
        if [ -n "$missing" ]; then
          echo "::error::missing repository secrets:$missing"
          exit 1
        fi
    - name: Install git-crypt
      shell: bash
      run: |
        set -euo pipefail
        if command -v git-crypt >/dev/null; then exit 0; fi
        if [ "$RUNNER_OS" = macOS ]; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install git-crypt
        else
          sudo apt-get update
          sudo apt-get install -y git-crypt
        fi
    - name: Unlock git-crypt
      shell: bash
      env:
        GITCRYPT_KEY_B64: ${{ inputs.gitcrypt-key }}
      run: bash .github/scripts/git-crypt-unlock.sh
    - name: Native request-signing key
      shell: bash
      env:
        NATIVE_KEY_HEX: ${{ inputs.native-key-hex }}
      run: |
        set -euo pipefail
        umask 077
        key="$RUNNER_TEMP/native-request-signing.key"
        printf %s "$NATIVE_KEY_HEX" | xxd -r -p > "$key"
        test "$(wc -c < "$key" | tr -d ' ')" = 32 || { echo "::error::PROJECTAG_NATIVE_SIGNING_KEY_HEX is not 32 bytes of hex"; exit 1; }
        echo "PROJECTAG_NATIVE_SIGNING_KEY_FILE=$key" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      continue-on-error: true
      with:
        workspaces: |
          . -> target
          backend -> target
          tools/agx -> target
          mobile -> target
        prefix-key: ${{ inputs.cache-key }}
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/master' }}
