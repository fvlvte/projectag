# Linux QA gate for pull requests and every master commit: static checks, core
# and backend tests, and a software-adapter client harness. On master each push
# runs every job (no path filter, no cancellation) and the `master gate` job is
# its single pass/fail result. `core`, `backend` and `client` each run as
# parallel matrix legs; every check step names the leg that runs it, and a
# job's result is success only when all its legs passed. Job `evidence` merges
# the legs' evidence into one artifact per family. It does not block `cargo agx deploy --from-ci`,
# which requires a green master-packages run. Job `report` posts one `QA gate` comment per
# run to the Paperclip issue named by the branch and, when every required run
# is green and the issue carries `awaiting-ci`, advances it to its review
# stages (.github/scripts/upload-paperclip-qa-summary.sh). No agent is woken
# directly. Nothing here publishes a binary; evidence stays in private Actions
# artifacts. `.github/**` is git-crypt-exempt so GitHub can read this file.
name: qa-linux
run-name: ${{ github.event.inputs.pr_number && format('pr_number={0}', github.event.inputs.pr_number) || github.event.pull_request.title || github.workflow }}

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repo pull request this run stands in for
        required: false
        default: ""
        type: string
  schedule:
    # Nightly full run on master: every job regardless of changed paths, so
    # drift that no PR touched is caught and reported to QA Analyst.
    - cron: "0 3 * * *"

concurrency:
  # Pull requests cancel superseded runs; every master commit keeps its own
  # run so each build number has a gate result.
  group: qa-linux-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # dorny/paths-filter lists the PR's changed files through the API; the report
  # job reads the PR labels and head SHA for the gate.
  pull-requests: read
  # The report job reads the other required workflow's run for the same head.
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  # Any rustc warning from a first-party (path) package fails its cargo
  # command, including warnings replayed from a cached build. Fix the cause
  # instead of suppressing the lint. Unlike RUSTFLAGS, this does not
  # invalidate the build cache or replace the wasm getrandom cfg.
  CARGO_BUILD_WARNINGS: deny

jobs:
  changes:
    # Heavy jobs run only when their inputs changed; `static` always runs.
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      backend: ${{ steps.filter.outputs.backend }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'examples/moonlight-counter/**'
              - 'examples/harmony-games/**'
              - 'backend/**'
              - 'tools/**'
              - 'vendor/**'
              - 'mobile/**'
              # Compile-time embeds (characters, cinematics, fonts, and the
              # content projectag-core's build.rs bakes in) and the authored
              # worlds the local-sim unit tests read.
              - 'assets/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'build_support.rs'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'checks.toml'
              - 'VERSION'
              - 'BUILD'
              - 'STORE_BUILD'
              - '.github/workflows/qa-linux.yml'
              - 'qa/scenarios/world-content/editor-return.toml'
              - 'qa/scenarios/world-content/editor-usability.toml'
              - 'qa/scenarios/world-content/editor-storeys.toml'
              - 'qa/scenarios/world-content/editor-emberdawn-atmosphere.toml'
            backend:
              - 'backend/**'
              - 'crates/actors-core/**'
              # projectag-core's build.rs embeds the authored content.
              - 'assets/content/**'
              # The job drives agx's backend harnesses and catalogued scenarios.
              - 'tools/agx/**'
              - 'tools/agx-core/**'
              - 'qa/**'
              # auth-service's Harmony suite drives the real worker script.
              - 'scripts/harmony*.py'
              - 'scripts/test_harmony*.py'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'VERSION'
              - 'BUILD'
              - 'Cargo.lock'
              - '.github/workflows/qa-linux.yml'
            client:
              - 'src/**'
              - 'crates/**'
              - 'backend/**'
              - 'assets/**'
              - 'qa/**'
              - 'tools/agx/**'
              - 'tools/agx-core/**'
              - 'vendor/**'
              - 'mobile/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'build_support.rs'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'VERSION'
              - 'BUILD'
              - 'STORE_BUILD'
              - '.github/workflows/qa-linux.yml'

  static:
    name: static (docs, node, catalogue, content)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve dispatched pull request
        id: dispatch_pr
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          DISPATCH_SHA: ${{ github.sha }}
        run: python3 .github/scripts/resolve-dispatch-pr.py
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt pkg-config libssl-dev nano
      - name: Unlock git-crypt
        id: unlock
        run: |
          test -n "${GITCRYPT_KEY_B64}" || { echo "Add repository secret GITCRYPT_KEY_B64"; exit 1; }
          bash .github/scripts/git-crypt-unlock.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        id: rust
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Documentation check
        run: python3 scripts/check-docs.py
      - name: Engine workflow pilot contracts
        run: |
          python3 scripts/test_check_doc_impact.py
          python3 scripts/test_project_intake.py
      - name: Repository bloat check
        if: ${{ github.event_name == 'pull_request' || steps.dispatch_pr.outputs.number }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.dispatch_pr.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || steps.dispatch_pr.outputs.head_sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          # checkout runs with persist-credentials: false, so the base commit
          # and exact author head are fetched explicitly. HEAD is GitHub's
          # synthetic merge checkout, not the revision reviewed by doc-impact.
          git fetch --depth=1 "https://x-access-token:${FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BASE_SHA" "$HEAD_SHA"
          python3 scripts/check-bloat.py --base "$BASE_SHA" --no-merge-base
      - name: Documentation impact pilot (advisory)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-doc-impact.py --base "$BASE_SHA" --head "$HEAD_SHA" --json > "$RUNNER_TEMP/doc-impact.json"
      - name: Upload documentation impact report
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: documentation-impact
          path: ${{ runner.temp }}/doc-impact.json
          if-no-files-found: warn
          retention-days: 14
      - name: Standalone ZIP encryption regression
        run: |
          python3 -m venv "$RUNNER_TEMP/zip-crypto"
          "$RUNNER_TEMP/zip-crypto/bin/pip" install pyzipper==0.4.0
          "$RUNNER_TEMP/zip-crypto/bin/python" scripts/test_standalone_zip_crypto.py
      - name: Pinned DXC staging and Windows packaging contracts
        run: python3 -B -W error scripts/tests/test_dxc_runtime.py
      - name: Node source contracts
        run: |
          set -o pipefail
          # Source-contract failures can quote decrypted source; this log is
          # public. Keep the full TAP output on the runner and print only test
          # names, counts and the failing location.
          status=0
          for f in tests/*.test.mjs; do
            echo "== $f"
            if ! node --test "$f" > "$RUNNER_TEMP/node-test.log" 2>&1; then status=1; fi
            grep -E '^(not ok|# (tests|pass|fail|cancelled))|^  location: ' "$RUNNER_TEMP/node-test.log" | sed -E "s#$GITHUB_WORKSPACE/##" || true
          done
          rm -f "$RUNNER_TEMP/node-test.log"
          exit "$status"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Website build and tests
        run: |
          set -o pipefail
          # Build and test output can quote decrypted source; this log is
          # public. Print only the step result and the test counts.
          cd website
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/website.log" 2>&1 || { echo "npm ci failed"; exit 1; }
          npm run build >> "$RUNNER_TEMP/website.log" 2>&1 || { echo "website build failed"; exit 1; }
          status=0
          npm test > "$RUNNER_TEMP/website-test.log" 2>&1 || status=1
          grep -E '^(not ok|# (tests|pass|fail|cancelled))|^ℹ (tests|pass|fail)' "$RUNNER_TEMP/website-test.log" || true
          rm -f "$RUNNER_TEMP/website.log" "$RUNNER_TEMP/website-test.log"
          exit "$status"
      - name: Python script tests
        env:
          # The hosted fixture, hosted editor, building-asset and firepit tests refuse to
          # run without an existing TMPDIR (no storage fallback); runners leave it unset.
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 scripts/test_check_docs.py
          python3 scripts/test_check_suppressions.py
          python3 scripts/test_check_qa_homes.py
          python3 scripts/test_qa_periodic_report.py
          python3 scripts/check-test-layout.py
          python3 scripts/test_check_test_layout.py
          python3 scripts/check-ui-glyphs.py
          python3 scripts/test_check_ui_glyphs.py
          python3 scripts/test_count_loc.py
          python3 scripts/test_check_bloat.py
          python3 scripts/test_repo_trackers.py
          python3 scripts/test_paperclip_insights.py
          python3 scripts/test_paperclip_redact.py
          python3 scripts/test_check_public_messages.py
          python3 scripts/test_ci_hosted_admission_guards.py
          python3 scripts/test_resolve_dispatch_pr.py
          python3 scripts/test_upload_paperclip_qa_summary.py
          python3 scripts/test_paperclip_human_qa.py
          python3 scripts/test_paperclip_issue.py
          python3 scripts/test_rebase_open_prs.py
          python3 scripts/test_harmony_worker.py
          python3 scripts/test_harmony_publish.py
          python3 tests/test_harmony_examples.py
          python3 scripts/test_import_character_creator_kit.py
          python3 scripts/test-character-creator-assets.py
          python3 backend/scripts/test-environment-harness.py
          python3 backend/scripts/test_boss_rewards_runner.py
          python3 backend/scripts/test_ownership_runner.py
          python3 backend/scripts/test_playtest_runner.py
          python3 backend/scripts/test_web_receipt_runner.py
          python3 backend/scripts/test-qa-hosted-client.py
          python3 backend/scripts/test_qa_hosted_editor.py
          python3 backend/scripts/test_qa_hosted_world_editor.py
          python3 backend/scripts/test_hosted_child_restart.py
          python3 backend/scripts/test_public_boss_e2e.py
          python3 -W error scripts/test_directional_shadow_cascades.py
          python3 -W error scripts/test_island_sector_clip.py
          python3 -W error scripts/test_emberdawn_heightfield.py
          python3 -W error scripts/test_emberdawn_atmosphere.py
          python3 -W error scripts/test_shores_creatures.py
          python3 -B -W error -m unittest discover -s scripts/tests -p 'test_monster_collision.py'
          python3 -W error scripts/test_client_performance.py
          python3 -W error scripts/test_metal_gpu_spans.py
          python3 -W error backend/scripts/test-log-collector.py
          python3 -W error backend/scripts/test-projectag-email-setup.py
          python3 -W error tests/test_browser_fixture.py
          python3 -W error tests/test_configure_infura.py
          python3 -W error tests/test_fetch_production_diagnostics.py
          python3 -W error tests/test_production_profiling.py
          python3 -W error -m unittest discover -s scripts/agent-hooks -p 'test_*.py'
          python3 scripts/test_vendor_hunks.py
          python3 -W error scripts/test_building_asset_qa.py
          python3 -W error scripts/test_shores_firepit.py
          python3 -W error scripts/test_shores_supplied_animation.py
          python3 -W error scripts/test_shores_supplied.py
          python3 -B -W error scripts/test_shores_fresh_static.py
          python3 -B -W error scripts/test_shores_fresh_placement.py
      - name: Public PR title and body scan
        if: ${{ github.event_name == 'pull_request' || steps.dispatch_pr.outputs.number }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title || steps.dispatch_pr.outputs.title }}
          PR_BODY: ${{ github.event.pull_request.body || steps.dispatch_pr.outputs.body }}
        run: python3 .github/scripts/check-public-messages.py
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: |
            tools/agx -> target
            backend -> target
          prefix-key: qa-linux-static
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: QA catalogue validation
        run: cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa validate
      - name: Every ready QA scenario has a home
        run: python3 scripts/check-qa-homes.py --report
      - name: Tool assertion and deployment contracts
        run: >-
          cargo run --quiet --locked --manifest-path tools/agx/Cargo.toml --
          check --id agx.tests --report "$RUNNER_TEMP/agx-check-static.json"
      - name: Upload AGX check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agx-check-static
          path: ${{ runner.temp }}/agx-check-static.json
          if-no-files-found: warn
          retention-days: 14
      - name: Patch-note nano and deploy terminal flow
        run: python3 tools/agx/tests/patchnotes_terminal.py --agx tools/agx/target/debug/agx --report "$RUNNER_TEMP/patchnotes-terminal.json"
      - name: Upload patch-note terminal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patchnotes-terminal-evidence
          path: ${{ runner.temp }}/patchnotes-terminal.*
          if-no-files-found: warn
          retention-days: 14
      - name: Content check
        run: cargo run --quiet --manifest-path backend/Cargo.toml -p projectag-core --bin content-check
      # The suppression and formatting gates run last and even after an
      # earlier check failed, so one push reports every static result instead
      # of stopping at the first style slip. They still fail the job.
      - name: Lint suppression ratchet
        # On pull requests the base commit bounds the baseline, so a change
        # cannot raise its own allowance in the same diff. The bloat step
        # fetches it, but it is skipped when an earlier check failed.
        if: ${{ !cancelled() && steps.unlock.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || steps.dispatch_pr.outputs.base_sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
              || git fetch --depth=1 "https://x-access-token:${FETCH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BASE_SHA"
            python3 scripts/check-suppressions.py --base "$BASE_SHA"
          else
            python3 scripts/check-suppressions.py
          fi
      - name: Rust formatting (every workspace and standalone package)
        # `cargo fmt` from a workspace root covers all of its members; a
        # virtual manifest is not found through --manifest-path, so enter each
        # root. tests/projectag-qa-linux.test.mjs keeps this list complete.
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          set -euo pipefail
          for root in . backend tools/agx tools/wgsl-check examples/moonlight-counter examples/harmony-games examples/harmony-starter examples/harmony-tiled-starter crates/harmony-game-rules examples/harmony-crab-courier; do
            echo "== cargo fmt --check ($root)"
            (cd "$root" && cargo fmt --check)
          done

  core:
    # Six parallel legs of one job: the setup steps run in every leg and each
    # check step names the one leg that runs it. needs.core.result is success
    # only when every leg passed. The service and shard fixture suites are
    # their own leg so they no longer sit behind the authority tests.
    name: core ${{ matrix.leg }} (client check, schedules, authority)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        leg: [checks, shipped, authority, services, editor-a, editor-b]
    env:
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt pkg-config libssl-dev cmake clang lld llvm nasm \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxi-dev xvfb xauth \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers libvulkan1
      - name: Unlock git-crypt
        run: |
          test -n "${GITCRYPT_KEY_B64}" || { echo "Add repository secret GITCRYPT_KEY_B64"; exit 1; }
          bash .github/scripts/git-crypt-unlock.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: |
            . -> target
            backend -> target
          prefix-key: qa-linux-core
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Vendored block compiler compatibility (compile only)
        if: ${{ matrix.leg == 'checks' }}
        run: |
          cargo agx check --id vendor.block.check
      - name: Vendored UI text measurement and layout regressions
        if: ${{ matrix.leg == 'checks' }}
        run: |
          cargo test --locked -p bevy_ui --lib widget::text::tests::
          cargo test --locked -p bevy_ui --lib layout::ui_surface::text_buffer_tests::
      - name: Vendored winit retired window regressions
        if: ${{ matrix.leg == 'checks' }}
        run: |
          timeout 600s xvfb-run -a cargo agx check --id winit.retired-destroyed --id winit.native-retired-destroyed
      - name: cargo check --features game
        if: ${{ matrix.leg == 'checks' }}
        run: cargo check --features game
      - name: cargo check --features game,actors
        if: ${{ matrix.leg == 'checks' }}
        run: cargo check --features game,actors
      - name: cargo check --features lua --bin tikdong
        if: ${{ matrix.leg == 'checks' }}
        run: cargo check --features lua --bin tikdong
      - name: Standalone bot keeps the saved broadcast
        if: ${{ matrix.leg == 'checks' }}
        run: cargo test -p tikdong --bin tikdong --features lua -- session_tests::connected_room_uses_the_saved_broadcast --exact
      - name: Independent product clients
        if: ${{ matrix.leg == 'checks' }}
        run: |
          cargo check -p projectag-client --bin projectag
          cargo check -p actors-client --bin actors
          cargo check -p client-services --no-default-features
          cargo check -p tikdong --features gm-playtest-helper --bin playtest-helper
          cargo check -p projectag-client --features gm-playtest-helper --bin playtest-helper
      - name: cargo check (wasm32 web client)
        if: ${{ matrix.leg == 'checks' }}
        # The browser client has its own Bevy feature table and dependency
        # set (Cargo.toml wasm32 target); the native checks prove nothing
        # about it. `.cargo/config.toml` carries the getrandom cfg.
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --features game,web-webgl2 --bin engine
          cargo check -p projectag-client --target wasm32-unknown-unknown --features web-webgl2 --bin projectag
          cargo check -p actors-client --target wasm32-unknown-unknown --features web-webgl2 --bin actors
      - name: Moonlight unit and native socket tests
        if: ${{ matrix.leg == 'checks' }}
        # Twice: the 2D build, then `3d`, the only build that compiles the gfx
        # quality tables, mesh LOD, scene3d, resume and render-profile tests.
        run: |
          cargo run --quiet --locked --manifest-path tools/agx/Cargo.toml -- check --id moonlight.lib.harness.2d --id moonlight.lib.harness
      - name: "Moonlight ray tracing: example compiles, GPU-free unit tests"
        if: ${{ matrix.leg == 'checks' }}
        # Shipped desktop sets enable `raytracing` (opt-in, default Off).
        # Runners have no ray-query GPU, so the example is compile-only;
        # run it by hand on an Apple9+ Mac.
        run: |
          cargo run --quiet --locked --manifest-path tools/agx/Cargo.toml -- check --id moonlight.example.raytracing --id moonlight.lib.raytracing
      - name: Independent Moonlight host
        if: ${{ matrix.leg == 'checks' }}
        run: CARGO_TARGET_DIR=target cargo test --locked --manifest-path examples/moonlight-counter/Cargo.toml
      - name: Harmony example rules and application components
        if: ${{ matrix.leg == 'checks' }}
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo test --locked --manifest-path crates/harmony-game-rules/Cargo.toml
          cargo test --locked --manifest-path examples/harmony-games/Cargo.toml --no-default-features --lib
          cargo test --locked --manifest-path examples/harmony-games/Cargo.toml --bin harmony-games
      - name: Independent Moonlight browser checks
        if: ${{ matrix.leg == 'checks' }}
        # Resolve the standalone host separately so product features cannot
        # supply missing browser bindings. Reuse the core job's target cache.
        env:
          CARGO_TARGET_DIR: target
        run: |
          cargo check --locked --manifest-path examples/moonlight-counter/Cargo.toml --target wasm32-unknown-unknown --features moonlight/web-webgl2 --bin moonlight-counter
          cargo check --locked --manifest-path examples/moonlight-counter/Cargo.toml --target wasm32-unknown-unknown --features moonlight/web-webgpu --bin moonlight-counter
          cargo check --locked --manifest-path examples/harmony-games/Cargo.toml --target wasm32-unknown-unknown --features web-webgl2 --bin harmony-games
          cargo check --locked --manifest-path examples/harmony-games/Cargo.toml --target wasm32-unknown-unknown --features web-webgpu --bin harmony-games
      - name: Engine and launcher package boundaries
        if: ${{ matrix.leg == 'checks' }}
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path tools/agx/Cargo.toml --features engine-checks --test engine_packages
      - name: Unit tests (shipped feature set)
        if: ${{ matrix.leg == 'shipped' }}
        # Every `#[cfg(test)]` module in the crate, not only `schedule_tests`:
        # the filter hid a mail_ui test that panicked on the blank world for
        # the same reason the `qa fixtures` build did (2026-09-16).
        run: |
          cargo test -p projectag-client --features engine-test-support,raytracing --lib -- --test-threads=1
          cargo test -p client-services --features ui,test-support --lib
          cargo test -p actors-core --features live,lua
          cargo test -p projectag-updater --lib
          cargo test --locked -p tikdong-opus
      - name: Unit tests (editor, actors, authored worlds)
        # Tests that read the authored Shores/Emberfall worlds are gated on
        # `local-sim` (dev/QA simulation, never a shipped set); this variant
        # is the only place they run. Two legs split its one libtest list by
        # name, each in one process on one thread: editor-a runs the tests
        # whose names contain an EDITOR_SPLIT entry and editor-b skips exactly
        # those, so together they run every test once.
        if: ${{ matrix.leg == 'editor-a' || matrix.leg == 'editor-b' }}
        env:
          EDITOR_LEG: ${{ matrix.leg }}
          EDITOR_SPLIT: "games::projectag::editor_publish:: games::projectag::play:: games::projectag::edit:: games::projectag::content_studio::"
        run: |
          set -euo pipefail
          read -ra split <<< "$EDITOR_SPLIT"
          skips=()
          for name in "${split[@]}"; do skips+=(--skip "$name"); done
          # Client test worlds share the process-wide origin used by editor fixtures.
          if [ "$EDITOR_LEG" = editor-a ]; then
            cargo test -p projectag-client --features projectag-editor,local-sim,engine-test-support --lib -- --test-threads=1 "${split[@]}"
            cargo test -p actors-client --features engine-test-support --lib
          else
            cargo test -p projectag-client --features projectag-editor,local-sim,engine-test-support --lib -- --test-threads=1 "${skips[@]}"
          fi
      - name: Unit tests (play-test helper grant, cancellation, and install root)
        if: ${{ matrix.leg == 'shipped' }}
        run: |
          cargo test -p projectag-client --features projectag-editor,qa-harness,engine-test-support --lib -- --test-threads=1 playtest_helper::tests::
      - name: Unit tests (helper offline redemption)
        if: ${{ matrix.leg == 'shipped' }}
        run: cargo test -p projectag-client --features gm-playtest-helper,engine-test-support --lib -- --test-threads=1 draft_child_rejects_bad_mode_isolation_and_offline_redemption
      - name: Unit tests (editor save readback and stair landings)
        if: ${{ matrix.leg == 'shipped' }}
        run: cargo test -p projectag-client --features engine-test-support,qa-harness,projectag-editor --lib -- --test-threads=1 readback_and_landing
      - name: Unit tests (editor publication under qa-harness)
        if: ${{ matrix.leg == 'shipped' }}
        run: |
          cargo test -p projectag-client --features projectag-editor,local-sim,engine-test-support,qa-harness --lib -- --test-threads=1 games::projectag::qa::tests:: editor_fix_scenarios_read_existing_state_paths
      - name: Unit tests (creator body-armor fixture)
        if: ${{ matrix.leg == 'shipped' }}
        run: cargo test -p projectag-client --features local-sim,engine-test-support,qa-harness --lib -- --test-threads=1 creator_body_armor_fixture_requires_the_qa_session_and_release
      - name: Unit tests (QA window flags)
        if: ${{ matrix.leg == 'checks' }}
        run: cargo test -p projectag-client --features engine-test-support,qa-harness --lib -- --test-threads=1 app::qa::tests
      - name: Unit tests (character creator probes)
        if: ${{ matrix.leg == 'checks' }}
        run: cargo test -p projectag-client --features engine-test-support,qa-harness --lib -- --test-threads=1 games::projectag::character_creator::probe::tests
      - name: Backend product dependency and routing boundaries
        if: ${{ matrix.leg == 'checks' }}
        # The compile check omits the hosted-admission feature: Actions swaps
        # its native crate for an empty stub (scripts/vendor-pack.py), so it
        # cannot compile here. backend/Dockerfile builds it from the real
        # sources, and the dependency-closure script still resolves it.
        run: |
          python3 backend/scripts/check-product-boundaries.py
          cargo check --locked --manifest-path backend/Cargo.toml --no-default-features \
            --features auth-service/actors,api-gateway/actors,config-service/actors \
            -p api-gateway -p auth-service -p wallet-service -p store-service \
            -p config-service -p live-ingest-service -p chess-service -p migrator
          cargo check --locked --manifest-path backend/Cargo.toml --no-default-features \
            --features auth-service/projectag,auth-service/harmony,api-gateway/projectag \
            -p api-gateway -p auth-service -p config-service -p projectag-service -p projectag-shard -p migrator
          cargo run --quiet --locked --manifest-path tools/agx/Cargo.toml -- check --id backend.composition.gateway --id backend.composition.auth
          cargo run --quiet --locked --manifest-path tools/agx/Cargo.toml -- check --id backend.auth-service.unit
          cargo test --manifest-path backend/Cargo.toml -p config-service --no-default-features
          cargo test --manifest-path backend/Cargo.toml -p config-service --no-default-features --features actors
          cargo test --manifest-path backend/Cargo.toml -p live-ingest-service -- transport_tests::transport_loss_and_verified_room_replacement --exact
      - name: Shipped service image leaves hosted admission off
        if: ${{ matrix.leg == 'checks' }}
        run: python3 scripts/ci-hosted-admission-guards.py
      - name: Shared backend infrastructure
        if: ${{ matrix.leg == 'checks' }}
        run: |
          cargo test --locked --manifest-path backend/Cargo.toml -p projectag-playtest-package --lib
          cargo test --manifest-path backend/Cargo.toml -p actors360-common --features projectag-web
          cargo clippy --locked --manifest-path backend/Cargo.toml -p actors360-common --features projectag-web --all-targets -- -D warnings
          cargo test --manifest-path backend/Cargo.toml -p runtime-diagnostics --features diagnostics-system
          cargo test --manifest-path backend/Cargo.toml -p identity-policy --features server-reservations
      - name: Shared-core authority tests
        if: ${{ matrix.leg == 'authority' }}
        run: cargo test --manifest-path backend/Cargo.toml -p projectag-core --features authority,schema
      - name: Shared-core client world 7 slot
        if: ${{ matrix.leg == 'authority' }}
        run: cargo test --manifest-path backend/Cargo.toml -p projectag-core --test authored_geometry world7_uses_the_map_spawn_and_legacy_arrival_stays_put -- --exact
      - name: Service and shard fixture suites
        if: ${{ matrix.leg == 'services' }}
        timeout-minutes: 45
        run: |
          cargo run --quiet --locked --manifest-path tools/agx/Cargo.toml -- check \
            --id backend.projectag-service --id backend.projectag-shard \
            --id backend.projectag-service.public-boss-journey --id backend.projectag-service.network-load \
            --id backend.api-gateway

  backend:
    # Three parallel legs: the harnesses, the registered database boundaries
    # and the scenario runs. Setup steps run in each, each check step names
    # its leg, and each leg uploads its evidence for job `evidence` to merge.
    # The boundaries leg writes no qa-backend files; its upload warns and is
    # skipped, and the merge still collects the harness and scenario reports.
    name: backend ${{ matrix.leg }} (isolated PostgreSQL harnesses)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        leg: [harnesses, boundaries, scenarios]
    env:
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
      # Debug service binaries on a shared runner take longer than the 12 s
      # developer default to open their ports (seen 2026-09-14: the environment
      # harness converged locally and hit "connection refused" here).
      PROJECTAG_QA_CONVERGE_SEC: "90"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install build dependencies and PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt pkg-config libssl-dev cmake clang lld llvm postgresql postgresql-contrib
          sudo systemctl stop postgresql || true
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
      - name: Unlock git-crypt
        run: |
          test -n "${GITCRYPT_KEY_B64}" || { echo "Add repository secret GITCRYPT_KEY_B64"; exit 1; }
          bash .github/scripts/git-crypt-unlock.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: |
            tools/agx -> target
            backend -> target
          prefix-key: qa-linux-backend
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Harness tools present
        run: command -v initdb pg_ctl createdb psql
      - name: Harmony product boundary
        if: ${{ matrix.leg == 'harnesses' }}
        run: cargo test --locked --manifest-path backend/Cargo.toml -p harmony -p harmony-web
      - name: Exchange harness (bank, mail, trade receipts)
        if: ${{ matrix.leg == 'harnesses' }}
        run: cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa backend exchange --output "$RUNNER_TEMP/qa-backend/exchange"
      - name: Environment harness (service, shards, live socket)
        if: ${{ matrix.leg == 'harnesses' }}
        run: cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa backend environment --output "$RUNNER_TEMP/qa-backend/environment"
      - name: Accounts and ranking scenarios (web accounts, rankings, playtime)
        if: ${{ matrix.leg == 'scenarios' }}
        # Sequential on purpose: the ranking and exchange scripts both bind
        # loopback port 55441. items.delivery.audit runs in qa-periodic.
        run: |
          cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa run \
            identity.web-accounts economy.ranking.playtime recovery.maintenance-rollout \
            items.content-audit world-content.shores-migration \
            world-content.gm-playtest-helper world-content.map-publication \
            recovery.ownership-database economy.boss-rewards \
            || echo "::warning::backend scenario failures; see the report below"
          # Wrapped cargo/test output shares stdout with the runner, so the
          # report file named by output/qa/latest.txt is the machine-readable
          # result, not stdout.
          REPORT_DIR="$(cat output/qa/latest.txt)"
          mkdir -p "$RUNNER_TEMP/qa-backend/scenarios"
          cp "$REPORT_DIR"/qa-report.json "$REPORT_DIR"/report.md "$RUNNER_TEMP/qa-backend/scenarios/" 2>/dev/null || true
          python3 - "$REPORT_DIR/qa-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          required = {"identity.web-accounts", "economy.ranking.playtime", "recovery.maintenance-rollout", "items.content-audit", "world-content.shores-migration", "world-content.gm-playtest-helper", "world-content.map-publication", "recovery.ownership-database", "economy.boss-rewards"}
          passed = {s["id"] for s in report.get("scenarios", []) if s.get("result") == "pass"}
          failed = required - passed
          for s in report.get("scenarios", []):
              print(f"{s['id']}: {s['result']} ({s.get('duration_ms', 0)} ms) {s.get('detail', '')[:120]}")
          for n in report.get("not_run", []):
              print(f"{n['id']}: not run: {n.get('reason', '')[:120]}")
          if failed:
              print("Required scenarios did not pass: " + ", ".join(sorted(failed)))
          sys.exit(1 if failed else 0)
          PY
      - name: Registered service database boundaries
        if: ${{ matrix.leg == 'boundaries' }}
        timeout-minutes: 90
        run: |
          cargo run --quiet --locked --manifest-path tools/agx/Cargo.toml -- check \
            --id backend.chess-service-database \
            --id backend.projectag-service.delivery \
            --id backend.projectag-ownership-database \
            --id backend.projectag-service-content-audit \
            --id backend.projectag-publication-database \
            --id backend.projectag-shores-migration \
            --id backend.projectag-authority-lifecycle
      - name: Corpse linger driver assertions
        if: ${{ matrix.leg == 'harnesses' }}
        timeout-minutes: 15
        # combat.corpse-linger itself runs in qa-periodic.
        # These portable driver tests do not establish the authenticated journey.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa-backend/corpse-linger"
          cargo test --locked --manifest-path backend/Cargo.toml -p projectag-service \
            --example corpse-linger-journey -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/qa-backend/corpse-linger/driver-tests.log"
          python3 - "$RUNNER_TEMP/qa-backend/corpse-linger/driver-tests.log" <<'PYTEST'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          required = {
              "corpse_watch_requires_a_listed_gap_before_respawn",
              "a_corpse_listed_beside_a_living_id_is_rejected",
              "arena_file_owns_entity_and_tiles_and_rejects_contract_drift",
          }
          passed = set(re.findall(r"^test tests::(\w+) \.\.\. ok$", log, re.MULTILINE))
          missing = required - passed
          if missing:
              sys.exit("Required corpse driver assertions did not pass: " + ", ".join(sorted(missing)))
          PYTEST
      - name: Upload backend evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          # Job `evidence` merges the legs into projectag-qa-backend-evidence.
          name: projectag-qa-backend-evidence-${{ matrix.leg }}
          path: ${{ runner.temp }}/qa-backend/**
          if-no-files-found: warn
          retention-days: 14

  client:
    # Software-adapter client harness (xvfb + Mesa lavapipe).
    # Product assertions and fixture failures must fail this job. Semantic
    # image review remains an explicit blocked result until QA Vision reviews
    # the captured pixels; the non-strict runner permits that review handoff.
    # Four parallel shards of one job. needs.client.result is success only
    # when every shard passed. CI disables engine build-identity, so one
    # `qa run` rebuilt the same release engine before every scenario. Each
    # shard builds that engine once and passes --no-build. Shard 3 keeps every
    # hosted-client scenario and prebuilds the opt-level-3 fixture binaries
    # --no-build would otherwise skip. The Caddy check is a client lib test,
    # not the release engine, so it runs on shard 3. The fixture PNG suites
    # build target/debug/engine with --features game, so they run on shard 1.
    # Shard 4 builds the editor engine after its standard scenarios.
    # Each shard uploads its evidence for job `evidence` to merge.
    name: client ${{ matrix.shard }}/4 (software adapter, hosted animation + fixtures)
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    outputs:
      # Keep the individual fixture result because fixtures produce PNGs,
      # not scenario reports. A panic also fails the overall client job.
      # Only shard 1 runs them; the other shards leave this output unset.
      fixtures_outcome: ${{ matrix.shard == 1 && steps.fixtures.outcome || '' }}
    env:
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
      PROJECTAG_QA_BACKGROUND: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install build dependencies, xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt pkg-config libssl-dev cmake clang lld llvm nasm \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libvulkan-dev \
            xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri vulkan-tools \
            postgresql postgresql-contrib
          sudo systemctl stop postgresql || true
          echo "/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin" >> "$GITHUB_PATH"
          # winit/xkbcommon-dl dlopens libxkbcommon-x11.so.0 when the harness
          # sidecar starts. libxkbcommon-dev does not install that runtime
          # (AGS-48 / nightly 34945876232).
          ldconfig -p | grep -F libxkbcommon-x11.so.0
          # ubuntu-22.04 jammy shipped lvp_icd.x86_64.json. ubuntu-latest is
          # noble; mesa-vulkan-drivers 25.2 installs lvp_icd.json instead.
          # Hardcoding the jammy name made the loader report Failed to open
          # JSON file / Found no drivers! (AGS-52 / run 34949330448).
          ICD=""
          for candidate in \
            /usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
            /usr/share/vulkan/icd.d/lvp_icd.json; do
            if [ -f "$candidate" ]; then
              ICD="$candidate"
              break
            fi
          done
          if [ -z "$ICD" ]; then
            ICD="$(find /usr/share/vulkan /usr/lib -name 'lvp_icd*.json' \
              ! -name '*i686*' ! -name '*i386*' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$ICD" ] || [ ! -f "$ICD" ]; then
            echo "No lavapipe ICD JSON after mesa-vulkan-drivers install"
            ls -la /usr/share/vulkan/icd.d/ || true
            dpkg -L mesa-vulkan-drivers | grep -E 'icd|lvp' || true
            exit 1
          fi
          test -f /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          echo "Using lavapipe ICD $ICD"
          ls -la "$ICD" /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so
          # VK_DRIVER_FILES is the current loader name; VK_ICD_FILENAMES is
          # the alias wgpu/Bevy still read. Both must name a file that exists.
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
      - name: Unlock git-crypt
        run: |
          test -n "${GITCRYPT_KEY_B64}" || { echo "Add repository secret GITCRYPT_KEY_B64"; exit 1; }
          bash .github/scripts/git-crypt-unlock.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: |
            . -> target
            tools/agx -> target
            backend -> target
          prefix-key: qa-linux-client
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Software Vulkan adapter present
        run: |
          test -n "${VK_ICD_FILENAMES:-}"
          test -f "$VK_ICD_FILENAMES"
          xvfb-run -a vulkaninfo --summary > "$RUNNER_TEMP/vulkaninfo-summary.txt"
          head -40 "$RUNNER_TEMP/vulkaninfo-summary.txt"
          grep -Ei 'llvmpipe|lavapipe' "$RUNNER_TEMP/vulkaninfo-summary.txt"
      - name: QA doctor
        run: cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa doctor --json
      - name: Hosted map through real Caddy
        if: ${{ matrix.shard == 3 }}
        # cargo test --lib of projectag-client. It does not run either
        # release engine, so it stays off the shard that builds both.
        run: python3 scripts/test-hosted-map-caddy.py
      - name: Build isolated hosted fixture services
        # Keep these available when the scenario runner reuses a client via
        # --no-build; the fixture never connects to another developer server.
        # Shard 3 is the only shard with hosted-client scenarios. --no-build
        # skips qa-hosted-client.py's compile, which would have built these
        # services, content-check and qa-combat-arena at dev opt-level 3.
        # The other shards have no hosted scenario and keep the short build.
        env:
          QA_LINUX_CLIENT_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          command -v initdb pg_ctl createdb psql python3
          if [ "$QA_LINUX_CLIENT_SHARD" = 3 ]; then
            export CARGO_PROFILE_DEV_OPT_LEVEL=3
          fi
          cargo build --locked --manifest-path backend/Cargo.toml \
            -p auth-service --bin auth-service \
            -p api-gateway --bin api-gateway \
            -p projectag-service --bin projectag-service \
            -p projectag-request-signing --bin sign-fixture-request
          if [ "${CARGO_PROFILE_DEV_OPT_LEVEL:-}" = 3 ]; then
            cargo build --locked --manifest-path backend/Cargo.toml \
              -p projectag-core --bin content-check --features authority
            cargo build --locked --manifest-path backend/Cargo.toml \
              -p projectag-core --features authority --example qa-combat-arena
          fi
      - name: Build the shared QA engine
        # Same command and env as prepare_engine for a non-editor scenario,
        # with the public-Actions feature policy already applied.
        env:
          PROJECTAG_DEFAULT_API: "off"
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          BEVY_ASSET_ROOT: ${{ github.workspace }}
          CARGO_MANIFEST_DIR: ${{ github.workspace }}
        run: |
          cargo build --manifest-path Cargo.toml --release --features game,local-sim,raytracing,qa-harness --bin engine
      - name: Client harness scenarios (shard 1)
        # One of the maintained shards; together the shard steps run every
        # scenario once. Durations are the runtimes left after the shared build.
        if: ${{ matrix.shard == 1 }}
        run: |
          set -euo pipefail
          # qa-hosted-client.py refuses to start without TMPDIR; runners leave it unset.
          export TMPDIR="$RUNNER_TEMP"
          cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa run --driver harness --ready-timeout 240 --require-execution --json --no-build \
            --output "$RUNNER_TEMP/qa-client" \
            movement.touch.dock-controls windows.text-fit-sweep chat.input.focus-type windows.bag.open-close movement.touch.desktop-unchanged \
            | tee "$RUNNER_TEMP/qa-client-run.json"
      - name: Client harness scenarios (shard 2)
        # One of the maintained shards; together the shard steps run every
        # scenario once. Durations are the runtimes left after the shared build.
        if: ${{ matrix.shard == 2 }}
        run: |
          set -euo pipefail
          # qa-hosted-client.py refuses to start without TMPDIR; runners leave it unset.
          export TMPDIR="$RUNNER_TEMP"
          cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa run --driver harness --ready-timeout 240 --require-execution --json --no-build \
            --output "$RUNNER_TEMP/qa-client" \
            npc-quest.dialogue-text-wrap windows.spellbook-icon movement.creator-female-walk recovery.maintenance-notice-desktop movement.touch.phone-fit movement.touch.phone-camera-actions \
            | tee "$RUNNER_TEMP/qa-client-run.json"
      - name: Client harness scenarios (shard 3)
        # Every hosted-client scenario stays on this shard so one opt-level-3
        # fixture build serves all four. The other three are short client runs
        # that fill the time the hosted compile used to occupy.
        if: ${{ matrix.shard == 3 }}
        run: |
          set -euo pipefail
          # qa-hosted-client.py refuses to start without TMPDIR; runners leave it unset.
          export TMPDIR="$RUNNER_TEMP"
          cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa run --driver harness --ready-timeout 240 --require-execution --json --no-build \
            --output "$RUNNER_TEMP/qa-client" \
            movement.hosted-animation-manifest identity.second-factor-login combat.target-frame-desktop combat.target-frame-compact harness.selftest.click-roundtrip windows.patchnotes-desktop recovery.update-handoff-desktop \
            | tee "$RUNNER_TEMP/qa-client-run.json"
      - name: Client harness scenarios (shard 4)
        # Standard-feature scenarios only. The editor scenario is the next
        # step, after the editor engine replaces target/release/engine.
        if: ${{ matrix.shard == 4 }}
        run: |
          set -euo pipefail
          # qa-hosted-client.py refuses to start without TMPDIR; runners leave it unset.
          export TMPDIR="$RUNNER_TEMP"
          cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa run --driver harness --ready-timeout 240 --require-execution --json --no-build \
            --output "$RUNNER_TEMP/qa-client" \
            windows.creator-female-appearance movement.touch.browser-phone windows.creator-female-armor movement.touch.tablet-hud \
            | tee "$RUNNER_TEMP/qa-client-run.json"
      - name: Build the editor QA engine
        # world-content.editor-return needs projectag-editor. That binary
        # overwrites target/release/engine, so it is built after the standard
        # scenarios on this shard and is not the binary they just ran.
        if: ${{ matrix.shard == 4 }}
        env:
          PROJECTAG_DEFAULT_API: "off"
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          BEVY_ASSET_ROOT: ${{ github.workspace }}
          CARGO_MANIFEST_DIR: ${{ github.workspace }}
        run: |
          cargo build --manifest-path Cargo.toml --release --features game,local-sim,raytracing,qa-harness,projectag-editor --bin engine
      - name: Client harness scenarios (shard 4 editor)
        if: ${{ matrix.shard == 4 }}
        run: |
          set -euo pipefail
          # qa-hosted-client.py refuses to start without TMPDIR; runners leave it unset.
          export TMPDIR="$RUNNER_TEMP"
          # Separate output: the runner refuses a non-empty --output directory,
          # and this invocation must not replace the standard scenarios' report.
          cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa run --driver harness --ready-timeout 240 --require-execution --json --no-build \
            --output "$RUNNER_TEMP/qa-client-editor" \
            world-content.editor-return \
            | tee "$RUNNER_TEMP/qa-client-editor-run.json"
      - name: Fixture PNG suites
        id: fixtures
        if: ${{ always() && matrix.shard == 1 }}
        # qa fixtures builds target/debug/engine --features game. That binary
        # is not the release engine, so the shortest shard runs the suites.
        run: xvfb-run -a cargo run --quiet --manifest-path tools/agx/Cargo.toml -- qa fixtures --output "$RUNNER_TEMP/qa-fixtures"
      - name: Stage public client evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/qa-client-public"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ -d "$RUNNER_TEMP/qa-client" ]; then
            (cd "$RUNNER_TEMP/qa-client" && find . -type f -links 1 \
              ! -ipath '*/data/*' ! -iname 'fixture.json' -print0 \
              | cpio --null --pass-through --make-directories --quiet "$stage")
          fi
          if [ -d "$RUNNER_TEMP/qa-client-editor" ]; then
            # A second qa run cannot reuse qa-client: a non-empty output
            # directory is refused. Stage the editor report beside the others.
            mkdir -p "$stage/editor"
            (cd "$RUNNER_TEMP/qa-client-editor" && find . -type f -links 1 \
              ! -ipath '*/data/*' ! -iname 'fixture.json' -print0 \
              | cpio --null --pass-through --make-directories --quiet "$stage/editor")
          fi
          if [ -f "$RUNNER_TEMP/qa-client-run.json" ]; then
            cp "$RUNNER_TEMP/qa-client-run.json" "$stage/qa-client-run.json"
          fi
          if [ -f "$RUNNER_TEMP/qa-client-editor-run.json" ]; then
            mkdir -p "$stage/editor"
            cp "$RUNNER_TEMP/qa-client-editor-run.json" "$stage/editor/qa-client-run.json"
          fi
      - name: Upload client evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          # Job `evidence` merges the shards into projectag-qa-linux-evidence.
          name: projectag-qa-linux-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/qa-client-public/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload fixture renders
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: projectag-qa-fixtures
          path: ${{ runner.temp }}/qa-fixtures/**
          if-no-files-found: warn
          retention-days: 14

  windows-owned-files:
    name: Windows plaintext owner tests
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' || github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install git-crypt
        # Chocolatey no longer carries git-crypt; use the upstream Windows
        # release binary pinned by digest.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 -o "$HOME/bin/git-crypt.exe" https://github.com/AGWA/git-crypt/releases/download/0.7.0/git-crypt-0.7.0-x86_64.exe
          echo "8c54a3b583cd4fc1483c952480116a9c86f771b02d4403fc6d3627b26cf146e2  $HOME/bin/git-crypt.exe" | sha256sum -c -
          cygpath -w "$HOME/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Unlock git-crypt
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null; then
            mkdir -p "$HOME/bin"
            printf '%s\n' '#!/usr/bin/env bash' 'exec python "$@"' > "$HOME/bin/python3"
            chmod +x "$HOME/bin/python3"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi
          bash .github/scripts/git-crypt-unlock.sh
      - name: Play-test lifecycle and plaintext owner
        shell: bash
        run: |
          cargo test -p projectag-client --features projectag-editor,engine-test-support --lib playtest_lifecycle:: -- --test-threads=1
      - name: asset-store Windows adapter and winfs tests
        shell: bash
        run: |
          set -euo pipefail
          run_counted() {
            local expected="$1"
            shift
            "$@" 2>&1 | tee asset-store-windows-test.log
            local passed
            passed="$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' asset-store-windows-test.log | paste -sd' ' -)"
            if [ "$passed" != "$expected" ]; then
              echo "expected passed counts '$expected', got '$passed': $*" >&2
              exit 1
            fi
          }
          run_counted "5" cargo test --locked -p asset-store --features store --lib store::sys::windows::tests
          run_counted "6 1" cargo test --locked -p asset-store-winfs --lib --tests

  api-gateway-live-spacing:
    name: api-gateway live spacing
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt pkg-config libssl-dev cmake clang
      - name: Unlock git-crypt
        run: |
          test -n "${GITCRYPT_KEY_B64}" || { echo "Add repository secret GITCRYPT_KEY_B64"; exit 1; }
          bash .github/scripts/git-crypt-unlock.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Live splice spacing
        run: cargo test --locked --manifest-path backend/Cargo.toml -p api-gateway --bin api-gateway live_transport_tests::walking_through_live_proxy_preserves_step_spacing -- --ignored --test-threads=1

  ios-voice-io-race:
    name: iOS voice callback race
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' || github.event_name != 'pull_request' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install git-crypt
        run: |
          set -euo pipefail
          if ! command -v git-crypt >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install git-crypt
          fi
      - name: Unlock git-crypt
        run: bash .github/scripts/git-crypt-unlock.sh
      - name: Voice I/O callback ordering
        run: bash mobile/ios/voice-io-race/run.sh

  evidence:
    # The client shards and backend legs upload their evidence under per-leg
    # names. This job merges each family back into the one artifact the report
    # job, QA Vision and agents download: projectag-qa-linux-evidence holds one
    # directory per shard, each with its own qa-report.json, and
    # projectag-qa-backend-evidence keeps the single-job layout because the
    # backend legs write disjoint directories.
    name: merge QA evidence
    needs: [backend, client]
    if: ${{ !cancelled() && (needs.backend.result != 'skipped' || needs.client.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Merge client evidence
        if: ${{ needs.client.result != 'skipped' }}
        uses: actions/upload-artifact/merge@v7
        with:
          name: projectag-qa-linux-evidence
          pattern: projectag-qa-linux-evidence-*
          separate-directories: true
          delete-merged: true
          retention-days: 14
      - name: Merge backend evidence
        if: ${{ !cancelled() && needs.backend.result != 'skipped' }}
        uses: actions/upload-artifact/merge@v7
        with:
          name: projectag-qa-backend-evidence
          pattern: projectag-qa-backend-evidence-*
          delete-merged: true
          retention-days: 14

  master-gate:
    # One result per master commit, which `agx ci status` and the CI watcher
    # read. A deploy requires master-packages instead (github::require_green).
    name: master gate
    needs: [changes, static, core, backend, client, windows-owned-files, ios-voice-io-race, api-gateway-live-spacing, evidence]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "master gate failed"; exit 1; }
          done

  report:
    name: report to Paperclip
    needs: [changes, static, core, backend, client, windows-owned-files, ios-voice-io-race, api-gateway-live-spacing, evidence]
    # Master pushes have no Paperclip issue; `master gate` reports them.
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
      PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
      PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}
      PAPERCLIP_QA_WORKFLOW: qa-linux
      # This is the automation gate into review, not final visual acceptance.
      # A product assertion, harness error or fixture panic fails the gate.
      PAPERCLIP_QA_RESULT: ${{ (needs.changes.result == 'success' && needs.static.result == 'success' && ((github.event_name != 'pull_request' && needs.core.result == 'success' && needs.backend.result == 'success' && needs.client.result == 'success' && needs.windows-owned-files.result == 'success' && needs.ios-voice-io-race.result == 'success' && needs.api-gateway-live-spacing.result == 'success') || (github.event_name == 'pull_request' && (needs.core.result == 'success' || (needs.core.result == 'skipped' && needs.changes.outputs.rust == 'false')) && (needs.backend.result == 'success' || (needs.backend.result == 'skipped' && needs.changes.outputs.backend == 'false')) && (needs.client.result == 'success' || (needs.client.result == 'skipped' && needs.changes.outputs.client == 'false')) && (needs.windows-owned-files.result == 'success' || (needs.windows-owned-files.result == 'skipped' && needs.changes.outputs.client == 'false')) && (needs.ios-voice-io-race.result == 'success' || (needs.ios-voice-io-race.result == 'skipped' && needs.changes.outputs.client == 'false')) && (needs.api-gateway-live-spacing.result == 'success' || (needs.api-gateway-live-spacing.result == 'skipped' && needs.changes.outputs.backend == 'false'))))) && 'success' || 'failure' }}
      PAPERCLIP_QA_JOBS: changes=${{ needs.changes.result }} static=${{ needs.static.result }} core=${{ needs.core.result }} backend=${{ needs.backend.result }} client=${{ needs.client.result }} windows-owned-files=${{ needs.windows-owned-files.result }} ios-voice-io-race=${{ needs.ios-voice-io-race.result }} api-gateway-live-spacing=${{ needs.api-gateway-live-spacing.result }} evidence=${{ needs.evidence.result }} client-fixtures=${{ needs.client.outputs.fixtures_outcome || 'not run' }}
      PAPERCLIP_QA_REQUIRED_ARTIFACTS: ${{ format('{0} {1}', needs.client.result != 'skipped' && 'projectag-qa-linux-evidence' || '', needs.backend.result != 'skipped' && 'projectag-qa-backend-evidence' || '') }}
      PAPERCLIP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PAPERCLIP_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      # Nightly runs have no issue branch. When PAPERCLIP_NIGHTLY_ENABLED is
      # true the summaries go to the standing issue `QA nightly`. Unset
      # disables that post while the Paperclip fleet is paused (2026-11-12).
      PAPERCLIP_NIGHTLY: ${{ github.event_name == 'schedule' && '1' || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download evidence
        uses: actions/download-artifact@v8
        with:
          pattern: projectag-qa-*-evidence
          path: qa-evidence
      - name: Post the QA gate and evidence summaries
        if: ${{ env.PAPERCLIP_API_KEY != '' && (github.event_name != 'schedule' || vars.PAPERCLIP_NIGHTLY_ENABLED == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find qa-evidence -name qa-report.json 2>/dev/null | sort)
          bash .github/scripts/upload-paperclip-qa-summary.sh "${reports[@]}"
      - name: Nightly Paperclip posting disabled
        if: ${{ github.event_name == 'schedule' && vars.PAPERCLIP_NIGHTLY_ENABLED != 'true' }}
        shell: bash
        run: |
          echo "nightly Paperclip posting disabled (PAPERCLIP_NIGHTLY_ENABLED is not true)"
          exit 0
