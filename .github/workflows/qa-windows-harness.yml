# Private Windows client-harness evidence. This workflow never publishes a
# qa-harness executable or QA pack to R2 / GitHub Releases. It runs when the
# `qa-windows` label is added and on every later push to a labelled PR, so the
# Paperclip QA gate (job report-paperclip) always has a run for the PR head.
# Hosted smoke also runs on every master commit; `cargo agx deploy --from-ci` requires
# that run to be green.
name: qa-windows-harness
run-name: ${{ github.event.inputs.pr_number && format('pr_number={0}', github.event.inputs.pr_number) || github.event.pull_request.title || github.workflow }}

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repo pull request this run stands in for
        required: false
        default: ""
        type: string
      full_gpu:
        description: Run full suite (enable only while the GPU runner is online)
        required: false
        default: false
        type: boolean
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: qa-windows-harness-${{ github.event_name == 'push' && github.sha || github.ref }}-${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'qa-windows' || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'qa-windows'))) && 'eligible' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'qa-windows' || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'qa-windows')) }}

permissions:
  contents: read
  # report-paperclip reads the PR labels/head and the qa-linux run for the gate.
  pull-requests: read
  actions: read

# Enable scheduled GPU allocation only while SHADOW-8PBBGGEQ is online:
# gh variable set GPU_RUNNER_AVAILABLE --body true
# gh variable set GPU_RUNNER_AVAILABLE --body false
# workflow_dispatch full_gpu=true explicitly requests the full suite as well.
jobs:
  build-qa-pack:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.label.name == 'qa-windows' || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'qa-windows')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # A rustc warning from a first-party package fails the cross build; fix
      # the cause instead of suppressing the lint.
      CARGO_BUILD_WARNINGS: deny
      GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install unlock and pack tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt zip pkg-config libssl-dev cmake clang lld llvm rsync

      - name: MSVC-named LLVM shims for cargo-xwin
        run: |
          bash .github/scripts/install-xwin-msvc-shims.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Require git-crypt key
        run: |
          if [ -z "${GITCRYPT_KEY_B64}" ]; then
            echo "Add repository secret GITCRYPT_KEY_B64 (git-crypt export-key piped through base64)."
            exit 1
          fi

      - name: Unlock git-crypt
        run: bash .github/scripts/git-crypt-unlock.sh

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo and xwin
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-targets: true
          prefix-key: qa-windows-harness
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Restore xwin SDK and cargo-xwin
        id: xwin-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.xwin
            ~/.cargo/bin/cargo-xwin
          key: xwin-msvc-${{ runner.os }}

      - name: Install cargo-xwin
        run: |
          if ! command -v cargo-xwin >/dev/null; then
            cargo install cargo-xwin --locked
          fi

      - name: Build private Windows QA pack
        run: |
          cargo run --release --manifest-path tools/agx/Cargo.toml -- \
            qa pack "$RUNNER_TEMP/projectag-qa-windows" \
            --target x86_64-pc-windows-msvc

      - name: Save xwin SDK and cargo-xwin
        # Only master writes caches; other branches restore master's.
        if: ${{ github.ref == 'refs/heads/master' && steps.xwin-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.xwin
            ~/.cargo/bin/cargo-xwin
          key: xwin-msvc-${{ runner.os }}

      - name: Build Windows updater library tests
        run: |
          cargo xwin test --locked -p projectag-updater --lib --no-run \
            --target x86_64-pc-windows-msvc --message-format=json-render-diagnostics \
            > "$RUNNER_TEMP/updater-tests.jsonl"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          messages = [json.loads(line) for line in (root / "updater-tests.jsonl").read_text().splitlines()]
          executables = [message["executable"] for message in messages
                         if message.get("reason") == "compiler-artifact"
                         and message["target"]["name"] == "projectag_updater"
                         and message["profile"]["test"] and message.get("executable")]
          if len(executables) != 1:
              raise SystemExit(f"expected one updater test executable, got {executables}")
          shutil.copy2(executables[0], root / "projectag-qa-windows" / "updater-tests.exe")
          PY

      - name: Zip private QA pack
        run: |
          (
            cd "$RUNNER_TEMP"
            zip -r projectag-qa-windows.zip projectag-qa-windows
          )

      - name: Upload private QA pack
        uses: actions/upload-artifact@v7
        with:
          name: projectag-qa-windows-pack
          path: ${{ runner.temp }}/projectag-qa-windows.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  run-qa:
    needs: build-qa-pack
    # Hosted software-rendering smoke: logic/UI plus known product assertions.
    # --require-execution fails product errors; pending visual receipts stay blocked.
    # The software adapter can't resize a presented window, so this list only
    # uses sizes set at window creation. It also takes seconds per frame.
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Download private QA pack
        uses: actions/download-artifact@v8
        with:
          name: projectag-qa-windows-pack
          path: ${{ runner.temp }}/qa-download

      - name: Expand private QA pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "qa-download\projectag-qa-windows.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "qa-expanded"
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          if (!(Test-Path -LiteralPath (Join-Path $expanded "projectag-qa-windows\pack.json"))) {
            throw "invalid QA pack"
          }

      - name: Install DirectX Shader Compiler
        shell: pwsh
        run: |
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          # The pack helper verifies the pinned archive and each DLL before staging.
          python (Join-Path $pack "scripts\stage-dxc-runtime.py") $pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust compiler for disposable updater fixtures
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Windows updater process and HTTP integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          $results = Join-Path $env:RUNNER_TEMP "qa-windows-results"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          python (Join-Path $pack "scripts\test-desktop-updater.py") --launcher (Join-Path $pack "start.exe") --output (Join-Path $results "desktop-updater-runtime.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows updater packed-store tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          $results = Join-Path $env:RUNNER_TEMP "qa-windows-results"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          & (Join-Path $pack "updater-tests.exe") patch::packed::tests:: --test-threads=1 --nocapture |
            Tee-Object -FilePath (Join-Path $results "updater-lib-tests.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: DX12 pinned runtime and FXC world-entry regressions
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:WGPU_DX12_COMPILER -ErrorAction SilentlyContinue
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          $results = Join-Path $env:RUNNER_TEMP "qa-windows-results\compiler"
          python (Join-Path $pack "scripts\test-dx12-compiler.py") --pack $pack --output $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows client harness
        id: qa
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
        run: |
          $ErrorActionPreference = "Stop"
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          $evidence = Join-Path $env:RUNNER_TEMP "qa-windows-results"
          $results = Join-Path $evidence "client"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($screen.Width / 2), [int]($screen.Height / 2))
          Set-Location $pack
          & (Join-Path $pack "agx.exe") qa run --pack . --output $results --driver harness --ready-timeout 240 --require-execution --json `
            harness.selftest.click-roundtrip windows.bag.open-close windows.bag-open-compact windows.spellbook-icon windows.minimize-restore chat.input.focus-type windows.creator-female-desktop windows.patchnotes-desktop recovery.update-handoff-desktop recovery.maintenance-notice-desktop harness.dx12-world-entry `
            | Tee-Object -FilePath (Join-Path $evidence "qa-run.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: projectag-qa-windows-evidence
          path: |
            ${{ runner.temp }}/qa-windows-results/**
          if-no-files-found: warn
          retention-days: 14

  run-qa-gpu:
    needs: build-qa-pack
    # Job-level condition prevents offline runner allocation when disabled.
    if: ${{ vars.GPU_RUNNER_AVAILABLE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_gpu) }}
    runs-on: [self-hosted, Windows, heavy-gpu]
    # One runner and about an hour per run: keep the running job and only the newest
    # waiting push, so pushes cannot queue up ahead of other work. Manual runs have
    # their own group, so a push never replaces evidence someone asked for.
    concurrency:
      group: qa-windows-gpu-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - name: Download private QA pack
        uses: actions/download-artifact@v8
        with:
          name: projectag-qa-windows-pack
          path: ${{ runner.temp }}/qa-download

      - name: Expand private QA pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "qa-download\projectag-qa-windows.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "qa-expanded"
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          if (!(Test-Path -LiteralPath (Join-Path $expanded "projectag-qa-windows\pack.json"))) {
            throw "invalid QA pack"
          }

      - name: Install DirectX Shader Compiler
        shell: pwsh
        run: |
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          # The pack helper verifies the pinned archive and each DLL before staging.
          python (Join-Path $pack "scripts\stage-dxc-runtime.py") $pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Git Bash on PATH for the toolchain action
        # dtolnay/rust-toolchain runs through `bash`, which this runner doesn't have on PATH.
        shell: pwsh
        run: |
          $roots = @("$env:ProgramFiles\Git", "${env:ProgramFiles(x86)}\Git", "$env:LOCALAPPDATA\Programs\Git")
          $git = $roots | Where-Object { Test-Path (Join-Path $_ 'bin\bash.exe') } | Select-Object -First 1
          if (-not $git) { throw 'Git for Windows bash.exe not found' }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $git 'bin')
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $git 'usr\bin')

      - name: Rust compiler for disposable updater fixtures
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Windows updater process and HTTP integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          $results = Join-Path $env:RUNNER_TEMP "qa-windows-results"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          python (Join-Path $pack "scripts\test-desktop-updater.py") --launcher (Join-Path $pack "start.exe") --output (Join-Path $results "desktop-updater-runtime.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows updater packed-store tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          $results = Join-Path $env:RUNNER_TEMP "qa-windows-results"
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          & (Join-Path $pack "updater-tests.exe") patch::packed::tests:: --test-threads=1 --nocapture |
            Tee-Object -FilePath (Join-Path $results "updater-lib-tests.log")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows client harness
        id: qa
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
        run: |
          $ErrorActionPreference = "Stop"
          $pack = Join-Path $env:RUNNER_TEMP "qa-expanded\projectag-qa-windows"
          $evidence = Join-Path $env:RUNNER_TEMP "qa-windows-results"
          $results = Join-Path $evidence "client"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point([int]($screen.Width / 2), [int]($screen.Height / 2))
          Set-Location $pack
          & (Join-Path $pack "agx.exe") qa run --pack . --output $results --driver harness --ready-timeout 240 --require-execution --json `
            harness.selftest.click-roundtrip windows.bag.open-close windows.spellbook-icon windows.minimize-restore chat.input.focus-type windows.creator-female-appearance windows.creator-female-armor windows.creator-female-compact windows.creator-female-short windows.creator-female-customization windows.creator-body-switch windows.creator-color-input windows.patchnotes-desktop windows.patchnotes-compact windows.patchnotes-short recovery.update-handoff-desktop recovery.update-handoff-compact recovery.update-handoff-short recovery.maintenance-notice-desktop recovery.maintenance-notice-compact recovery.maintenance-notice-short movement.creator-female-walk world-content.editor-draft `
            | Tee-Object -FilePath (Join-Path $evidence "qa-run.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload QA evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: projectag-qa-windows-gpu-evidence
          path: |
            ${{ runner.temp }}/qa-windows-results/**
          if-no-files-found: warn
          retention-days: 14

  report-paperclip:
    needs: [build-qa-pack, run-qa, run-qa-gpu]
    # Runs even when the pack build failed (skipped run-qa): the gate comment
    # must name a failed build, not stay silent.
    if: ${{ always() && needs.build-qa-pack.result != 'skipped' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPERCLIP_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
      PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_API_KEY }}
      PAPERCLIP_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}
      PAPERCLIP_FALLBACK_ISSUE_ID: ${{ secrets.PAPERCLIP_WINDOWS_ISSUE_ID }}
      PAPERCLIP_QA_WORKFLOW: qa-windows-harness
      PAPERCLIP_QA_ARTIFACT: projectag-qa-windows-evidence
      PAPERCLIP_QA_REQUIRED_ARTIFACTS: projectag-qa-windows-evidence ${{ needs.run-qa-gpu.result != 'skipped' && 'projectag-qa-windows-gpu-evidence' || '' }}
      PAPERCLIP_QA_RESULT: ${{ needs.run-qa.result == 'success' && (needs.run-qa-gpu.result == 'success' || needs.run-qa-gpu.result == 'skipped') && 'success' || 'failure' }}
      PAPERCLIP_QA_JOBS: build-qa-pack=${{ needs.build-qa-pack.result }} run-qa=${{ needs.run-qa.result }} run-qa-gpu=${{ needs.run-qa-gpu.result }}
      PAPERCLIP_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PAPERCLIP_PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout report helpers
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download QA evidence
        # Missing when build-qa-pack or run-qa failed before uploading.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: projectag-qa-windows-evidence
          path: qa-evidence/projectag-qa-windows-evidence

      - name: Download GPU QA evidence
        if: ${{ needs.run-qa-gpu.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: projectag-qa-windows-gpu-evidence
          path: qa-evidence/projectag-qa-windows-gpu-evidence

      - name: Post the QA gate and evidence summary
        if: ${{ env.PAPERCLIP_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find qa-evidence -name qa-report.json 2>/dev/null | sort)
          bash .github/scripts/upload-paperclip-qa-summary.sh "${reports[@]}"
