# Shippable build packages for every master commit. The release gates run as
# parallel shards (`gates`, one job per `cargo agx ci shards` entry) beside
# the platform packages (`package`). macOS is two jobs (`macos-part`): the
# desktop clients and the play-test helper do not share dist artifacts, so
# they compile at the same time and `macos-seal` seals the one package deploy
# downloads. Each build job runs `cargo agx ci build`: the same agx compile
# or gate function a local release runs, under the commit-derived version
# (MAJOR.MINOR as committed, BUILD = first-parent count minus committed
# FAMILY_BASE) and store counter.
# The `ios` job builds
# the iOS device archive unsigned; signing stays on the operator Mac.
# Outputs are sealed with AGX_CI_PACKAGE_KEY before upload: this repository is public, so its
# artifacts are readable by anyone. `cargo agx deploy --from-ci <commit>`
# downloads, verifies and stages them (every gate shard exactly once), and
# refuses unless this run is green for that commit. A failing gate shard
# cancels the run, which then reads as not deployable. Docs:
# docs/operations/master-ci.md. `.github/**` is git-crypt-exempt so GitHub
# can read this file.
name: master-packages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # One active run per branch; a newer push queues behind it and never
  # cancels a started build. GitHub keeps only the newest pending run, so a
  # burst of pushes builds the running commit and the latest one.
  group: master-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  # Shipped builds deny warnings, as `cargo agx deploy` does.
  CARGO_BUILD_WARNINGS: deny
  # Shipped binaries carry the real vendor/native-ext tree and its features,
  # exactly as a local release; unlock still installs the cargo log filter.
  # `cargo agx ci build` refuses to package a stubbed build.
  PROJECTAG_CI_NATIVE_EXT: "1"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  gates:
    name: gates ${{ matrix.shard }}
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # A cold cache (new Cargo.lock or toolchain) compiles each build from
    # scratch; the light shard compiles several.
    timeout-minutes: 150
    permissions:
      contents: read
      # Fail fast: a failing shard cancels this run (last step).
      actions: write
    strategy:
      fail-fast: false
      # `cargo agx ci shards` must list exactly these shards and caches
      # (ci::shards::tests::the_workflow_matrix_lists_every_shard). Shards
      # of one build share its Rust cache; `save` marks its one writer.
      matrix:
        include:
          - shard: light
            cache: light
            save: true
          - shard: core
            cache: core
            save: true
          - shard: editor-nosim-1
            cache: editor-nosim
            save: true
          - shard: editor-nosim-2
            cache: editor-nosim
            save: false
          - shard: editor-sim-1
            cache: editor-sim
            save: false
          - shard: editor-sim-2
            cache: editor-sim
            save: false
          - shard: editor-sim-3
            cache: editor-sim
            save: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Build and store derivation require full first-parent history;
          # trees are fetched on demand.
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake clang lld llvm nasm binaryen \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers libvulkan1 xvfb xauth

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          # Only the light shard checks the wasm builds.
          targets: ${{ matrix.shard == 'light' && 'wasm32-unknown-unknown' || '' }}

      - uses: ./.github/actions/agx-package-setup
        with:
          gitcrypt-key: ${{ secrets.GITCRYPT_KEY_B64 }}
          native-key-hex: ${{ secrets.PROJECTAG_NATIVE_SIGNING_KEY_HEX }}
          package-key: ${{ secrets.AGX_CI_PACKAGE_KEY }}
          cache-key: gates-${{ matrix.cache }}
          # One writer per cache name: the other shards of that build restore it.
          save-cache: ${{ matrix.save }}

      - name: Run and seal the ${{ matrix.shard }} gate shard
        env:
          AGX_CI_PACKAGE_KEY: ${{ secrets.AGX_CI_PACKAGE_KEY }}
          # Only this step sees the native key; the script writes it for the
          # one command and deletes it after.
          NATIVE_KEY_HEX: ${{ secrets.PROJECTAG_NATIVE_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          echo "runner cores: $(nproc)"
          # The client test gates open windows under a virtual display.
          bash .github/scripts/with-native-signing-key.sh xvfb-run -a cargo agx ci build gates --shard "${{ matrix.shard }}" --out "$RUNNER_TEMP/package" --run-url "$RUN_URL"
          ls -l "$RUNNER_TEMP/package"

      - name: Upload the sealed gate shard
        uses: actions/upload-artifact@v7
        with:
          name: agx-gates-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.agxci
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Fail fast (cancel the run)
        # A failed gate makes the commit undeployable: stop the other shards
        # and the platform builds. Not on cancellation, so a cancel does not
        # cascade; a re-run of failed jobs re-runs the cancelled ones too.
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  macos-part:
    name: macos ${{ matrix.part }}
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Desktop features and gm-playtest-helper do not share dist artifacts.
      # Both parts restore package-macos; only clients writes it.
      matrix:
        include:
          - part: clients
            save: true
          - part: helper
            save: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Build and store derivation require full first-parent history;
          # trees are fetched on demand.
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: ./.github/actions/agx-package-setup
        with:
          gitcrypt-key: ${{ secrets.GITCRYPT_KEY_B64 }}
          native-key-hex: ${{ secrets.PROJECTAG_NATIVE_SIGNING_KEY_HEX }}
          package-key: ${{ secrets.AGX_CI_PACKAGE_KEY }}
          cache-key: package-macos
          save-cache: ${{ matrix.save }}

      - name: Build and seal the macos ${{ matrix.part }} part
        env:
          AGX_CI_PACKAGE_KEY: ${{ secrets.AGX_CI_PACKAGE_KEY }}
          # Only this step sees the native key; the script writes it for the
          # one command and deletes it after.
          NATIVE_KEY_HEX: ${{ secrets.PROJECTAG_NATIVE_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          bash .github/scripts/with-native-signing-key.sh cargo agx ci build macos --part "${{ matrix.part }}" --out "$RUNNER_TEMP/package" --run-url "$RUN_URL"
          ls -l "$RUNNER_TEMP/package"

      - name: Upload the sealed macos part
        uses: actions/upload-artifact@v7
        with:
          name: agx-macos-${{ matrix.part }}-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.agxci
          if-no-files-found: error
          retention-days: 1  # intermediate: only macos-seal reads it
          compression-level: 0

  package:
    name: ${{ matrix.kind }}
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # iOS keeps its own macOS runner (owner decision 2026-11-01) and builds
      # beside the two macos-part jobs. macos is not a row of this matrix.
      matrix:
        include:
          - kind: ios
            os: macos-latest
            targets: aarch64-apple-ios
            # build_rust_deps.sh builds the iOS app into its own target dir.
            workspaces: mobile -> ios/build/cargo
          - kind: windows
            os: ubuntu-latest
            targets: x86_64-pc-windows-gnu
            workspaces: ""
          - kind: web
            os: ubuntu-latest
            targets: wasm32-unknown-unknown
            workspaces: ""
          - kind: android
            os: ubuntu-latest
            targets: aarch64-linux-android
            workspaces: ""
          - kind: backend
            os: ubuntu-latest
            targets: ""
            workspaces: ""
    steps:
      - uses: actions/checkout@v7
        with:
          # Build and store derivation require full first-parent history;
          # trees are fetched on demand.
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Free disk
        if: ${{ runner.os == 'Linux' && matrix.kind != 'android' }}
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev cmake clang lld llvm nasm binaryen \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers libvulkan1 xvfb xauth

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.targets }}

      - uses: ./.github/actions/agx-package-setup
        with:
          gitcrypt-key: ${{ secrets.GITCRYPT_KEY_B64 }}
          native-key-hex: ${{ secrets.PROJECTAG_NATIVE_SIGNING_KEY_HEX }}
          package-key: ${{ secrets.AGX_CI_PACKAGE_KEY }}
          cache-key: package-${{ matrix.kind }}
          extra-workspaces: ${{ matrix.workspaces }}

      - name: mingw-w64 cross toolchain
        if: ${{ matrix.kind == 'windows' }}
        run: |
          # The same x86_64-pc-windows-gnu build a local `agx deploy windows`
          # makes (agx resolves mingw when cargo-xwin is absent; do not
          # install it). The native extension needs posix threads.
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          # A restored cargo cache may carry cargo-xwin from an older run.
          rm -f "$HOME/.cargo/bin/cargo-xwin"
          if command -v cargo-xwin >/dev/null; then echo "::error::cargo-xwin on PATH would select MSVC"; exit 1; fi

      - name: Android NDK and cargo-ndk
        if: ${{ matrix.kind == 'android' }}
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: DXC archive identity
        if: ${{ matrix.kind == 'windows' }}
        id: dxc
        run: |
          python3 -c 'import runpy; print("sha256=" + runpy.run_path("scripts/stage-dxc-runtime.py")["DXC_ARCHIVE_SHA256"])' >> "$GITHUB_OUTPUT"

      - name: Cache verified DXC archive
        if: ${{ matrix.kind == 'windows' }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dxc-archive
          key: dxc-archive-${{ steps.dxc.outputs.sha256 }}

      - name: Build and seal the ${{ matrix.kind }} package
        env:
          DXC_ARCHIVE_CACHE_DIR: ${{ runner.temp }}/dxc-archive
          AGX_CI_PACKAGE_KEY: ${{ secrets.AGX_CI_PACKAGE_KEY }}
          # Only this step sees the native key (not the mingw or NDK installs
          # above); the script writes it for the one command and deletes it.
          NATIVE_KEY_HEX: ${{ secrets.PROJECTAG_NATIVE_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          # The ios kind builds with code signing disabled: this job holds no
          # Apple identity or provisioning. `cargo agx deploy --from-ci
          # <commit> ios` signs and exports the archive on the operator's Mac.
          if [ "${{ matrix.kind }}" = ios ]; then xcodebuild -version; fi
          bash .github/scripts/with-native-signing-key.sh cargo agx ci build "${{ matrix.kind }}" --out "$RUNNER_TEMP/package" --run-url "$RUN_URL"
          ls -l "$RUNNER_TEMP/package"

      - name: Upload the sealed package
        uses: actions/upload-artifact@v7
        with:
          name: agx-${{ matrix.kind }}-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.agxci
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos-seal:
    name: macos
    needs: macos-part
    if: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The seal checks HEAD's commit-derived version, so it needs history.
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Require seal secrets
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
          AGX_CI_PACKAGE_KEY: ${{ secrets.AGX_CI_PACKAGE_KEY }}
        run: |
          missing=""
          [ -n "$GITCRYPT_KEY_B64" ] || missing="$missing GITCRYPT_KEY_B64"
          [ -n "$AGX_CI_PACKAGE_KEY" ] || missing="$missing AGX_CI_PACKAGE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      - name: Install git-crypt
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Unlock git-crypt
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
        run: bash .github/scripts/git-crypt-unlock.sh

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          # agx only. Restoring package-macos would pull the game target this
          # job does not compile.
          workspaces: tools/agx -> target
          prefix-key: master-packages-v2
          shared-key: package-macos-assemble
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Download the macos clients part
        uses: actions/download-artifact@v8
        with:
          name: agx-macos-clients-${{ github.sha }}
          path: ${{ runner.temp }}/macos-parts/clients

      - name: Download the macos helper part
        uses: actions/download-artifact@v8
        with:
          name: agx-macos-helper-${{ github.sha }}
          path: ${{ runner.temp }}/macos-parts/helper

      - name: Assemble the macos package
        env:
          AGX_CI_PACKAGE_KEY: ${{ secrets.AGX_CI_PACKAGE_KEY }}
        run: |
          set -euo pipefail
          mapfile -t clients < <(find "$RUNNER_TEMP/macos-parts/clients" -type f -name '*.agxci' | sort)
          mapfile -t helper < <(find "$RUNNER_TEMP/macos-parts/helper" -type f -name '*.agxci' | sort)
          if [ "${#clients[@]}" -ne 1 ] || [ "${#helper[@]}" -ne 1 ]; then
            echo "::error::expected one clients part and one helper part"
            find "$RUNNER_TEMP/macos-parts" -type f -print
            exit 1
          fi
          cargo agx ci assemble-macos --clients "${clients[0]}" --helper "${helper[0]}" --out "$RUNNER_TEMP/package" --run-url "$RUN_URL"
          ls -l "$RUNNER_TEMP/package"

      - name: Upload the sealed macos package
        uses: actions/upload-artifact@v7
        with:
          name: agx-macos-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.agxci
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
