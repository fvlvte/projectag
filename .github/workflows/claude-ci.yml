# Claude remote runs on claude/ci/<clone> (Linux) and claude/ci-mac/<clone> (macOS) branches. Never master: the
# owner adds master later with a checkpoint. Each push carries the clone's code (git-crypt encrypted like the rest
# of the repo) plus .claude-ci/cmd.sh, also encrypted. .github/scripts/claude-ci-run.sh unlocks with the
# existing GITCRYPT_KEY_B64 secret, deletes real credential files before anything runs, and sends every
# command's output into an age-encrypted results artifact that only the developer's local key opens. The cache
# is stored encrypted. This public log shows step names only, and the job always succeeds; the real exit code
# is inside the encrypted results.
name: claude-ci
run-name: claude-ci ${{ github.sha }}

on:
  push:
    branches: ["claude/ci/**", "claude/ci-mac/**"]

permissions:
  contents: read

concurrency:
  group: claude-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  RESULTS_RECIPIENT: age1jcr6psf5a8mnp0ujm97u9yhzknakvy3wwtrjgkgms5hyqr9hue6qc3409z

jobs:
  linux:
    if: startsWith(github.ref_name, 'claude/ci/')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: prepare runner
        run: |
          {
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
            sudo apt-get update -qq
            sudo apt-get install -y -qq git-crypt age zstd jq pkg-config libssl-dev cmake clang lld llvm nasm \
              libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxi-dev \
              libxcursor-dev libxrandr-dev libgl1-mesa-dev
          } > /dev/null 2>&1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ci-cache.enc
          key: claude-ci-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: claude-ci-${{ github.ref_name }}-
      - name: run
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
        run: bash .github/scripts/claude-ci-run.sh
      - name: save cache
        if: always() && hashFiles('ci-cache.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-cache.enc
          key: claude-ci-${{ github.ref_name }}-${{ github.run_id }}
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.age
          retention-days: 1
          if-no-files-found: ignore

  mac:
    if: startsWith(github.ref_name, 'claude/ci-mac/')
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: prepare runner
        run: |
          { brew install git-crypt age zstd jq openssl@3; } > /dev/null 2>&1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: ci-cache.enc
          key: claude-ci-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: claude-ci-${{ github.ref_name }}-
      - name: run
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
        run: bash .github/scripts/claude-ci-run.sh
      - name: save cache
        if: always() && hashFiles('ci-cache.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-cache.enc
          key: claude-ci-${{ github.ref_name }}-${{ github.run_id }}
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.age
          retention-days: 1
          if-no-files-found: ignore
