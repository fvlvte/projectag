# Claude remote runs on claude/ci/<clone> branches (never master; the owner adds master later with a checkpoint).
# Each push carries the clone's code (git-crypt encrypted like the rest of the repo) plus .claude-ci/cmd.sh,
# also encrypted. The runner unlocks with the existing GITCRYPT_KEY_B64 secret, deletes real credential files
# before anything runs, and sends every command's output into an age-encrypted results artifact that only
# the developer's local key opens. The cache is stored encrypted. This public log shows step names only, and
# the job always succeeds; the real exit code is inside the encrypted results.
name: claude-ci
run-name: claude-ci ${{ github.sha }}

on:
  push:
    branches: ["claude/ci/**"]

permissions:
  contents: read

concurrency:
  group: claude-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RESULTS_RECIPIENT: age1jcr6psf5a8mnp0ujm97u9yhzknakvy3wwtrjgkgms5hyqr9hue6qc3409z
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: prepare runner
        run: |
          {
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
            sudo apt-get update -qq
            sudo apt-get install -y -qq git-crypt age zstd jq pkg-config libssl-dev cmake clang lld llvm nasm \
              libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxi-dev \
              libxcursor-dev libxrandr-dev libgl1-mesa-dev
          } > /dev/null 2>&1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - name: restore cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ci-cache.enc
          key: claude-ci-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: claude-ci-${{ github.ref_name }}-

      - name: run
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
        run: |
          set +x +e
          R="$RUNNER_TEMP/claude-ci"; mkdir -p "$R/results"
          exec > "$R/results/runner.log" 2>&1
          set -u -o pipefail
          umask 077
          restored=0; if [ -f ci-cache.enc ] && [ "$(stat -c %s ci-cache.enc)" -gt 300000000 ]; then restored=1; fi  # a tiny cache counts as none
          bash .github/scripts/git-crypt-unlock.sh
          # real credentials never take part in a run: delete them, then write dummy placeholders for build scripts
          find backend/deploy -type f \( -name '*.env' -o -name '*.token' -o -name '*.password' -o -name '*.key' -o -path '*/certs/*' \) -delete 2>/dev/null
          rm -f admin/src/config.ts backend/scripts/qa-hosted-client.py backend/scripts/test-projectag-email-setup.py
          printf '%032d\n' 0 > backend/deploy/download.token; printf 'placeholder-0000\n' > backend/deploy/download.password; printf '%032d\n' 0 > backend/deploy/inbox-tool.token
          if [ -f ci-cache.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:GITCRYPT_KEY_B64 -in ci-cache.enc | zstd -dq | tar -x -C / && echo "cache restored"
            rm -f ci-cache.enc
          fi
          if [ ! -d vendor/native-ext ] && [ -f scripts/vendor-pack.py ]; then python3 scripts/vendor-pack.py ci-prepare; fi
          sub="$(jq -r '.sub // ""' .claude-ci/meta.json)"
          cd "$GITHUB_WORKSPACE/$sub"
          export CARGO_BUILD_JOBS="$(nproc)" CARGO_TERM_COLOR=never
          start=$(date +%s)
          bash "$GITHUB_WORKSPACE/.claude-ci/cmd.sh" > "$R/results/out.log" 2>&1
          echo $? > "$R/results/rc"
          echo $(( $(date +%s) - start )) > "$R/results/seconds"
          cd "$GITHUB_WORKSPACE"
          if [ "$restored" = 0 ]; then
            rm -rf target/debug/incremental
            tar -c "$HOME/.cargo/registry/index" "$HOME/.cargo/registry/cache" "$GITHUB_WORKSPACE/target" 2>/dev/null \
              | zstd -q -T0 -3 | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:GITCRYPT_KEY_B64 -out ci-cache.enc
          fi
          exec > /dev/null 2>&1
          tar -C "$R" -c results | zstd -q -T0 | age -r "$RESULTS_RECIPIENT" > "$GITHUB_WORKSPACE/results.age"
          exit 0

      - name: save cache
        if: always() && hashFiles('ci-cache.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: ci-cache.enc
          key: claude-ci-${{ github.ref_name }}-${{ github.run_id }}

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.age
          retention-days: 1
          if-no-files-found: ignore
