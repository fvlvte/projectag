# Claude remote runs on claude/ci/<clone> (Linux), claude/ci-mac/<clone> (macOS) and claude/ci-win/<clone>
# (Windows) branches. Never master: the owner adds master later with a checkpoint. Each push carries the
# clone's code (git-crypt encrypted like the rest of the repo) plus .claude-ci/cmd.sh, also encrypted. The run
# scripts unlock with the existing GITCRYPT_KEY_B64 secret, delete real credential files before anything runs,
# and send every command's output into an age-encrypted results artifact that only the developer's local key
# opens. Build caches travel as encrypted artifacts between runs, outside the repository's Actions cache.
# This public log shows step names only, and the jobs always succeed; the real exit code is inside the
# encrypted results.
name: claude-ci
run-name: claude-ci ${{ github.sha }}

on:
  push:
    branches: ["claude/ci/**", "claude/ci-mac/**", "claude/ci-win/**", "claude/ci-gpu/**"]

permissions:
  contents: read
  actions: read

concurrency:
  group: claude-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  RESULTS_RECIPIENT: age1jcr6psf5a8mnp0ujm97u9yhzknakvy3wwtrjgkgms5hyqr9hue6qc3409z

jobs:
  linux:
    if: startsWith(github.ref_name, 'claude/ci/')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: prepare runner
        timeout-minutes: 25
        run: |
          # Install only what the image lacks; bounded apt with retries and an archive.ubuntu.com fallback
          # (azure mirror hangs made this step run 36 min and exit 100, 2026-11-11). Log tail on failure.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 || true
          want="git-crypt age zstd jq pkg-config libssl-dev cmake clang lld llvm nasm libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev"
          missing=$(for p in $want; do dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed' || echo "$p"; done | tr '\n' ' ')
          echo "missing: ${missing:-none}"
          [ -z "${missing// }" ] && exit 0
          A="-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120"
          log="$RUNNER_TEMP/apt.log"
          try() { timeout 120 sudo apt-get $A update -qq >> "$log" 2>&1; timeout 480 sudo apt-get $A install -y -qq $missing >> "$log" 2>&1; }
          try && exit 0
          echo "apt attempt 1 failed; switching to archive.ubuntu.com"
          sudo sed -i \
            -e 's#http://azure.archive.ubuntu.com#https://archive.ubuntu.com#g' \
            -e 's#https://azure.archive.ubuntu.com#https://archive.ubuntu.com#g' \
            -e 's#http://security.ubuntu.com#https://archive.ubuntu.com#g' \
            -e 's#https://security.ubuntu.com#https://archive.ubuntu.com#g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          try && exit 0
          echo "apt failed twice; last log lines:"; tail -40 "$log"; exit 100
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: run
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/claude-ci-run.sh
      - name: upload cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache
          path: ci-cache.enc
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.age
          retention-days: 1
          if-no-files-found: ignore

  mac:
    if: startsWith(github.ref_name, 'claude/ci-mac/')
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: prepare runner
        run: |
          { brew install git-crypt age zstd jq openssl@3; } > /dev/null 2>&1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: run
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/claude-ci-run.sh
      - name: upload cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache
          path: ci-cache.enc
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.age
          retention-days: 1
          if-no-files-found: ignore

  # Windows has no git-crypt package: a Linux job unlocks and hands the tree over encrypted.
  win-src:
    if: startsWith(github.ref_name, 'claude/ci-win/') || startsWith(github.ref_name, 'claude/ci-gpu/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: prepare runner
        run: |
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=120"; log="$RUNNER_TEMP/apt.log"
          try() { timeout 300 sudo apt-get $A update -qq >> "$log" 2>&1; timeout 300 sudo apt-get $A install -y -qq git-crypt >> "$log" 2>&1; }
          try && exit 0
          sudo sed -i \
            -e 's#http://azure.archive.ubuntu.com#https://archive.ubuntu.com#g' \
            -e 's#https://azure.archive.ubuntu.com#https://archive.ubuntu.com#g' \
            -e 's#http://security.ubuntu.com#https://archive.ubuntu.com#g' \
            -e 's#https://security.ubuntu.com#https://archive.ubuntu.com#g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          try && exit 0
          echo "apt failed twice; last log lines:"; tail -40 "$log"; exit 100
      - name: pack
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
        run: bash .github/scripts/claude-ci-win-src.sh
      - name: upload source
        uses: actions/upload-artifact@v4
        with:
          name: win-src
          path: ${{ runner.temp }}/src.enc
          retention-days: 1
          compression-level: 0

  windows:
    needs: win-src
    # claude/ci-gpu/ runs on the owner's self-hosted RTX machine; it may be offline, so a run can queue.
    runs-on: ${{ startsWith(github.ref_name, 'claude/ci-gpu/') && fromJSON('["self-hosted","Windows","heavy-gpu"]') || 'windows-latest' }}
    timeout-minutes: ${{ startsWith(github.ref_name, 'claude/ci-gpu/') && 840 || 240 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: put Git Bash on PATH (self-hosted)
        if: startsWith(github.ref_name, 'claude/ci-gpu/')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $roots = @("$env:ProgramFiles\Git", "${env:ProgramFiles(x86)}\Git", "$env:LOCALAPPDATA\Programs\Git")
          $git = $roots | Where-Object { Test-Path (Join-Path $_ 'bin\bash.exe') } | Select-Object -First 1
          if (-not $git) { throw 'Git for Windows bash.exe not found' }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $git 'bin')
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $git 'usr\bin')
      - name: keep line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
      - name: prepare runner
        # Windows PowerShell 5 exists on every Windows host; a self-hosted one may lack pwsh on PATH
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'; $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'age.zip'
          Invoke-WebRequest -Uri 'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-windows-amd64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'F48D8F8F9EBE903AB5027ED067652F2CC1DB94BC206976430133B905DCD8E8C7') { throw 'age archive checksum mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'age')
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: fetch source
        uses: actions/download-artifact@v4
        with:
          name: win-src
          path: ${{ runner.temp }}/src
      - name: run
        env:
          GITCRYPT_KEY_B64: ${{ secrets.GITCRYPT_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/claude-ci-win.sh
      - name: upload cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache
          path: ci-cache.enc
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results.age
          retention-days: 1
          if-no-files-found: ignore
      - name: remove plaintext (self-hosted)
        if: always() && startsWith(github.ref_name, 'claude/ci-gpu/')
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          # QA evidence paths exceed MAX_PATH; rd with the \\?\ prefix removes them. Fail only if plaintext remains.
          $left = @()
          foreach ($p in @((Join-Path $env:RUNNER_TEMP 'claude-ci'), (Join-Path $env:RUNNER_TEMP 'src'), (Join-Path $env:GITHUB_WORKSPACE 'ci-cache.enc'), (Join-Path $env:GITHUB_WORKSPACE 'results.age'))) {
            if (-not (Test-Path -LiteralPath $p)) { continue }
            if ((Get-Item -LiteralPath $p -Force).PSIsContainer) { cmd /c rd /s /q "\\?\$p" } else { Remove-Item -LiteralPath $p -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $p) { $left += $p }
          }
          if ($left.Count -gt 0) { Write-Output "plaintext left: $($left -join ', ')"; exit 1 }
          exit 0
